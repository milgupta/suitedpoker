<!--
  The full-bleed variant of the mark, for the two places that apply their OWN
  corner rounding: the iOS home-screen icon and the Android maskable icon.

  Shipping the rounded tile to those slots double-rounds it — iOS masks a
  superellipse over corners that are already cut, leaving a pale halo of
  nothing at each corner. Same colours, same spade, same 0.62 scale as
  spade-tile.svg; only the rect's radius differs.

  The spade at 0.62 spans ~66 units across the 100-unit canvas, so it sits
  inside Android's 80-unit maskable safe circle with room to spare.
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SuitedPoker">
<defs>
<linearGradient id="spadeSquare" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F68FF"/><stop offset="1" stop-color="#1A2F9E"/></linearGradient>
</defs>
<rect width="100" height="100" fill="url(#spadeSquare)"/>
<g transform="translate(50,52) scale(0.62) translate(-50,-50)"><path d="M50 9 C50 9 17 38 17 57 C17 69 26 78 36 78 C41 78 46 76 49 72 C48 83 44 90 36 93 L64 93 C56 90 52 83 51 72 C54 76 59 78 64 78 C74 78 83 69 83 57 C83 38 50 9 50 9 Z" fill="#FFFFFF"/></g>
</svg>
